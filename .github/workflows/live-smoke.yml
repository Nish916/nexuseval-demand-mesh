name: Live Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public Demand Mesh and x402 boundary
        shell: bash
        run: |
          set -euo pipefail

          MESH="https://nexuseval-demand-mesh.vercel.app"
          CORE="https://nexuseval.vercel.app"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          fetch_until() {
            local url="$1" body="$2" headers="$3" expected="$4"
            local code=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS --connect-timeout 10 --max-time 20 \
                -H 'user-agent: NexusEval-Smoke/1.0' \
                -H 'x-nexus-observer: github-smoke' \
                -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)
              if [ "$code" = "$expected" ]; then
                echo "$code"
                return 0
              fi
              echo "Attempt $attempt for $url returned HTTP ${code:-curl-error}; retrying..." >&2
              sleep 10
            done
            echo "FINAL HTTP ${code:-curl-error} for $url" >&2
            echo "--- headers ---" >&2
            cat "$headers" >&2 || true
            echo "--- body preview ---" >&2
            head -c 1000 "$body" >&2 || true
            echo >&2
            return 1
          }

          echo "Checking RainDrop hit #1..."
          code1=$(fetch_until "$MESH/raindrop?q=before%20publishing%20an%20ad" "$TMP/b1" "$TMP/h1" 200)
          jq -e '.spec == "nexuseval-raindrop/1.0" and .status == "active" and .hitId and .challenge' "$TMP/b1" >/dev/null
          grep -qi '^x-nexus-signal: raindrop-v1' "$TMP/h1"
          hit1=$(jq -r '.hitId' "$TMP/b1")
          challenge1=$(jq -r '.challenge' "$TMP/b1")

          echo "Checking RainDrop hit #2 freshness..."
          code2=$(fetch_until "$MESH/raindrop?q=before%20publishing%20an%20ad" "$TMP/b2" "$TMP/h2" 200)
          hit2=$(jq -r '.hitId' "$TMP/b2")
          challenge2=$(jq -r '.challenge' "$TMP/b2")
          test -n "$hit2"
          test -n "$challenge2"
          test "$hit1" != "$hit2"
          test "$challenge1" != "$challenge2"

          echo "Checking Future Beacon..."
          beacon_code=$(fetch_until "$MESH/future-beacon.json" "$TMP/beacon" "$TMP/hb" 200)
          jq -e '.spec == "nexuseval-future-beacon/1.1" and .status == "active" and .deliveryModel.dynamicPerHitChallenge == true' "$TMP/beacon" >/dev/null

          echo "Checking core unpaid x402 boundary..."
          gate_code=""
          for attempt in 1 2 3; do
            gate_code=$(curl -sS --connect-timeout 10 --max-time 20 \
              -H 'user-agent: NexusEval-Smoke/1.0' \
              -H 'x-nexus-observer: github-smoke' \
              -H 'content-type: application/json' \
              -D "$TMP/hg" -o "$TMP/gate" -w '%{http_code}' \
              -X POST "$CORE/api/gate" \
              --data '{"objective":"smoke test","audience":"test","headline":"test","copy":"test","cta":"test"}' || true)
            [ "$gate_code" = "402" ] && break
            sleep 5
          done
          if [ "$gate_code" != "402" ]; then
            echo "Expected core /api/gate HTTP 402; got $gate_code" >&2
            cat "$TMP/hg" >&2 || true
            head -c 1000 "$TMP/gate" >&2 || true
            exit 1
          fi

          {
            echo "## Live production smoke: PASS"
            echo "- RainDrop: HTTP 200"
            echo "- RainDrop unique per hit: PASS"
            echo "- Future Beacon v1.1: HTTP 200"
            echo "- Core /api/gate unpaid boundary: HTTP 402"
            echo "- Self traffic marker: NexusEval-Smoke/1.0"
            echo "- Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
